; =====================================================================
; Configuração da automação de claims (CLM1)
; Somente parâmetros operacionais NÃO sensíveis. Nunca coloque senhas aqui.
; Comentários sempre em linha própria, começando com ";".
; =====================================================================

[sap]
; Trava de segurança: a automação só age nesta combinação de sistema e mandante.
sistema = PRD
mandante = 100

[nota]
tipo_nota = Z1
causa_grupo = 01
causa_codigo = 0001
; "1" corresponde a "Normal" na configuração da empresa (confirmado na CLM3).
prioridade = 1

[documento]
tipo = ZDC
laboratorio = L01
; Aplicação padrão antiga (só usada se a seção abaixo não existir).
aplicacao = PDF

[aplicacao_por_extensao]
; Alguns tipos de arquivo fazem o SAP abrir a janela "Aplicação" ao anexar.
; Aqui fica o código a escolher para cada extensão (procurado pelo TEXTO na lista).
; Tipos sem janela (ex.: .xlsx, .docx) não precisam estar aqui: o SAP escolhe sozinho.
; Se um tipo não listado abrir a janela, a automação PARA antes de gravar o documento.
.pdf = PDF
.zip = ZIP

[limites]
; Valores A CONFIRMAR no SAP (F1 no campo -> Informações técnicas).
descricao_max = 40
descricao_documento_max = 40
ordem_max = 10
item_max = 6

[execucao]
; SIMULACAO | ENSAIO | ASSISTIDO | AUTOMATICO
modo = SIMULACAO
; GRAVAÇÃO NO SAP. Com "sim", a interface passa a oferecer os modos
; Assistido (grava o documento ZDC) e Completo (grava o claim). Padrão: nao.
automatico_habilitado = nao

[armazenamento]
; Vazio = pasta padrão do usuário (%LOCALAPPDATA%\ClaimAutomation).
pasta_dados =

[avisos_aceitos]
; Janelas de informação que podem ser confirmadas com OK.
; Formato: nome = padrão do texto (* = qualquer trecho).
; Todas as janelas, aceitas ou não, são registradas no histórico.
bloqueio_cliente = O cliente * tem bloqueio de registro
; VA22, linha nova: aviso do cabeçalho ao confirmar o centro na aba Venda (26/10/2026)
condicoes_pagamento = Entrar Condições pagamento
; VA21, exportação: janela do endereço do emissor depois de confirmar o endereço (26/10/2026)
endereco_exportacao = Endereço de dds.mestre para o Emissor da ordem (*CabeçDoc.*)

[linha_cotacao]
; Linha nova na cotação (VA22): quantidade digitada na linha.
quantidade = 1

[arvore_atividades]
; Nó raiz da árvore "Seleção múltipla de atividades" (UNIDADE).
raiz = ROOT

; ---------------------------------------------------------------------
; Atividades
;   descricao   = texto EXATO do item dentro da pasta (é por ele que o item é achado)
;                 e da coluna "Descrição Atividade" na grade
;   subgrupo    = texto da coluna "Sub Grupo" na grade (conferido em cada linha)
;   pasta       = chave técnica da pasta na árvore (estável)
;   no          = SÓ REFERÊNCIA. O código do item muda quando a árvore muda
;                 (em 21/10/2026 todos deslocaram uma posição) e não é usado.
;   Textos confirmados na grade real em 20/10/2026 (ensaios A1071724E42D e E6E1DD0DCEB4).
;   responsavel = vazio (o SAP preenche), @usuario_logado ou um usuário fixo
; ---------------------------------------------------------------------

[atividade.analise]
descricao = ANALISE TECNICA
subgrupo = GRP-ENG
pasta = 20ENGENHARIA
no = 000000000660
responsavel =

[atividade.industrial]
descricao = TR
subgrupo = GRP-IND
pasta = 30INDUSTRIAL
no = 000000000683
responsavel = USUARIO_IND

[atividade.suprimentos]
descricao = TR
subgrupo = GRP-SUP
pasta = 40SUPRIMENTOS
no = 000000000687
responsavel = USUARIO_SUP

[atividade.custos]
descricao = TR
subgrupo = GRP-CUS
pasta = 50CUSTOS
no = 000000000689
responsavel = USUARIO_CUS

[atividade.com_produto_a]
descricao = PRODUTO_A
subgrupo = GRP-COM
pasta = 10COMERCIAL
no = 000000000647
responsavel = @usuario_logado

[atividade.com_produto_b]
descricao = PRODUTO_B
subgrupo = GRP-COM
pasta = 10COMERCIAL
no = 000000000648
responsavel = @usuario_logado

; ---------------------------------------------------------------------
; Rotas: atividades na ordem dos cliques (define a SEQ no SAP)
;   material / centro = linha nova na cotação (VA22), quando o orçamentista
;   marca "Criar linha nova na cotação". O centro é SEMPRE digitado.
; ---------------------------------------------------------------------

[rota.PRODUTO_A]
rotulo = Produto A
atividades = analise, com_produto_a
material = 10000001
centro = 1001

[rota.PRODUTO_B]
rotulo = Produto B
atividades = analise, com_produto_b
material = 10000002
centro = 1002

[rota.PRODUTO_B_CUSTO]
rotulo = Produto B + custo
atividades = analise, industrial, suprimentos, custos, com_produto_b
material = 10000002
centro = 1002

; =====================================================================
; Criação de cotação (VA21) — valores do programa "Criar Cotação" usado até out/2026
; =====================================================================

[cotacao]
tipo_documento = ZQT1
organizacao = 1000
canal = 30
escritorio = X001
; Tratamento no endereço do cliente (combo "Título")
titulo_endereco = 0008
; Validade da cotação a partir de hoje, em meses
validade_meses = 12
; Hora de recebimento do pedido (dados adicionais do cabeçalho); a data é a de hoje
hora_recebimento = 12:00:00

; Por tipo de cotação. Produto A e Produto B marcados juntos = UMA cotação com os dados
; de Produto A (equipe_produto_a) e duas linhas. Material e centro vêm de [rota.PRODUTO_A]
; e [rota.PRODUTO_B].
[cotacao.Nacional]
setor = 20
emissor = CLIENTE X
utilizacao = 003
equipe_produto_a = E10
equipe_produto_b = E11
pede_regiao = sim

[cotacao.Exportação]
setor = 80
emissor = CLIENTE Y
utilizacao = 004
equipe_produto_a = E12
equipe_produto_b = E12
codigo_postal = 1
pede_regiao = sim
pede_pais = sim

[cotacao.Cliente Especial]
setor = 80
emissor = CLIENTE Y
utilizacao = 004
equipe_produto_a = E14
equipe_produto_b = E14
nome_cliente_fixo = cliente
pede_regiao = nao
pede_cliente = nao

[pastas]
; Raízes de rede das propostas (as subpastas seguem o padrão do programa anterior)
raiz_produto_a = \\servidor\propostas\produto_a
raiz_produto_b = \\servidor\propostas\produto_b
