; =====================================================================
; Configuração da automação de claims (CLM1)
; Somente parâmetros operacionais NÃO sensíveis. Nunca coloque senhas aqui.
; Comentários sempre em linha própria, começando com ";".
; =====================================================================

[sap]
; Trava de segurança: a automação só age nesta combinação de sistema e mandante.
sistema = PRD
mandante = 100

[nota]
tipo_nota = Z1
causa_grupo = 01
causa_codigo = 0001
; "1" corresponde a "Normal" na configuração da empresa (confirmado na CLM3).
prioridade = 1

[documento]
tipo = ZDC
laboratorio = L01
; Aplicação escolhida quando o SAP pergunta (ex.: arquivos PDF).
aplicacao = PDF

[limites]
; Valores A CONFIRMAR no SAP (F1 no campo -> Informações técnicas).
descricao_max = 40
descricao_documento_max = 40
ordem_max = 10
item_max = 6

[execucao]
; SIMULACAO | ENSAIO | ASSISTIDO | AUTOMATICO
modo = SIMULACAO
; GRAVAÇÃO NO SAP. Com "sim", a interface passa a oferecer os modos
; Assistido (grava o documento ZDC) e Completo (grava o claim). Padrão: nao.
automatico_habilitado = nao

[armazenamento]
; Vazio = pasta padrão do usuário (%LOCALAPPDATA%\ClaimAutomation).
pasta_dados =

[avisos_aceitos]
; Janelas de informação que podem ser confirmadas com OK.
; Formato: nome = padrão do texto (* = qualquer trecho).
; Todas as janelas, aceitas ou não, são registradas no histórico.
bloqueio_cliente = O cliente * tem bloqueio de registro

[arvore_atividades]
; Nó raiz da árvore "Seleção múltipla de atividades" (UNIDADE).
raiz = ROOT

; ---------------------------------------------------------------------
; Atividades
;   descricao   = texto EXATO do item dentro da pasta (é por ele que o item é achado)
;                 e da coluna "Descrição Atividade" na grade
;   subgrupo    = texto da coluna "Sub Grupo" na grade (conferido em cada linha)
;   pasta       = chave técnica da pasta na árvore (estável)
;   no          = SÓ REFERÊNCIA. O código do item muda quando a árvore muda
;                 (em 21/10/2026 todos deslocaram uma posição) e não é usado.
;   Textos confirmados na grade real em 20/10/2026 (ensaios A1071724E42D e E6E1DD0DCEB4).
;   responsavel = vazio (o SAP preenche), @usuario_logado ou um usuário fixo
; ---------------------------------------------------------------------

[atividade.analise]
descricao = ANALISE TECNICA
subgrupo = GRP-ENG
pasta = 20ENGENHARIA
no = 000000000660
responsavel =

[atividade.industrial]
descricao = TR
subgrupo = GRP-IND
pasta = 30INDUSTRIAL
no = 000000000683
responsavel = USUARIO_IND

[atividade.suprimentos]
descricao = TR
subgrupo = GRP-SUP
pasta = 40SUPRIMENTOS
no = 000000000687
responsavel = USUARIO_SUP

[atividade.custos]
descricao = TR
subgrupo = GRP-CUS
pasta = 50CUSTOS
no = 000000000689
responsavel = USUARIO_CUS

[atividade.com_produto_a]
descricao = PRODUTO A
subgrupo = GRP-COM
pasta = 10COMERCIAL
no = 000000000647
responsavel = @usuario_logado

[atividade.com_produto_b]
descricao = PRODUTO B
subgrupo = GRP-COM
pasta = 10COMERCIAL
no = 000000000648
responsavel = @usuario_logado

; ---------------------------------------------------------------------
; Rotas: atividades na ordem dos cliques (define a SEQ no SAP)
; ---------------------------------------------------------------------

[rota.PRODUTO_A]
rotulo = Produto A
atividades = analise, com_produto_a

[rota.PRODUTO_B]
rotulo = Produto B
atividades = analise, com_produto_b

[rota.PRODUTO_B_CUSTO]
rotulo = Produto B + custo
atividades = analise, industrial, suprimentos, custos, com_produto_b
